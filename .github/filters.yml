typescript:
  - '**/*.{ts,tsx,js,jsx}'
  - 'package.json'
  - 'tsconfig.json'
python:
  - '**/*.py'
  - 'pyproject.toml'
swift:
  - '**/*.swift'
  - 'Package.swift'
rust:
  - '**/*.rs'
  - 'Cargo.toml'
go:
  - '**/*.go'
  - 'go.mod'
shell:
  - '**/*.sh'
  - '**/*.bash'
container:
  - 'Dockerfile*'
  - '**/*.tf'
  - '**/docker-compose*.yml'

