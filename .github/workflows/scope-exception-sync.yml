name: Scope Exception Sync

on:
  pull_request_target:
    types: [opened, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Propagate authorized scope exception
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          linked_issues="$(gh pr view "$PR_NUMBER" --repo "$REPOSITORY" --json closingIssuesReferences --jq '[.closingIssuesReferences[].number]')"
          if [[ "$(jq 'length' <<<"$linked_issues")" -ne 1 ]]; then
            echo "scope-exception-sync: exactly one closing Issue is required; no label granted"
            exit 0
          fi
          issue_number="$(jq -r '.[0]' <<<"$linked_issues")"
          authorized="$(gh issue view "$issue_number" --repo "$REPOSITORY" --json labels --jq 'any(.labels[].name; . == "scope:exception")')"
          if [[ "$authorized" != "true" ]]; then
            echo "scope-exception-sync: Issue #$issue_number does not authorize scope:exception"
            exit 0
          fi
          gh pr edit "$PR_NUMBER" --repo "$REPOSITORY" --add-label scope:exception
          echo "scope-exception-sync: propagated scope:exception from Issue #$issue_number to PR #$PR_NUMBER"
