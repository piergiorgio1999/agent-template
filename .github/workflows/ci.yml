name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  anti-rot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agent Config Check
        run: ./tools/agent-config-check/agent-config-check

  scope-guard:
    needs: anti-rot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope Guard
        run: ./tools/scope-guard/scope-guard origin/${{ github.base_ref || 'main' }}

  detect:
    needs: scope-guard
    runs-on: ubuntu-latest
    outputs:
      typescript: "false"
      swift: "false"
      python: "false"
      rust: "false"
      go: "false"
      shell: "false"
    steps:
      - run: echo "Language detection placeholder"

  checks:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - run: echo "Language checkers placeholder"

  security:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - run: echo "Gitleaks placeholder"
      - run: echo "Actionlint placeholder"
      - run: echo "Zizmor placeholder"

  gate:
    if: always()
    needs:
      - anti-rot
      - scope-guard
      - detect
      - checks
      - security
    runs-on: ubuntu-latest
    steps:
      - run: echo "CI Gate placeholder"
