name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  anti-rot:
    name: anti-rot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Check forbidden state files
        run: test -z "$(find . -maxdepth 2 -type f \( -name STATUS.md -o -name ROADMAP.md -o -name TASKS.md -o -name PLAN.md -o -name PROJECT_STATE.json \) -print)"
      - name: Check local links and paths
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir . './**/*.md'
          fail: true
          failIfEmpty: false

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: Validate workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.7 -color

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.24.2 detect --source=/repo --config=/repo/.gitleaks.toml --no-banner
      - name: Zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          online-audits: false
      - name: Conditional Trivy
        if: hashFiles('Dockerfile*', '**/Dockerfile*', '**/*.tf', '**/docker-compose*.yml') != ''
        run: docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.59.1 fs --scanners vuln,misconfig /repo

  paths:
    name: path detection
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      python: ${{ steps.filter.outputs.python }}
      swift: ${{ steps.filter.outputs.swift }}
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      shell: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with: {filters: .github/filters.yml}

  checks:
    name: relevant checks
    needs: paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - name: TypeScript
        if: needs.paths.outputs.typescript == 'true'
        run: npm ci && npx biome check . && npx tsc --noEmit && npx vitest run --reporter=junit --outputFile=reports/junit.xml
      - name: Python
        if: needs.paths.outputs.python == 'true'
        run: python -m pip install ruff pyright pytest && ruff check . && pyright && pytest --junitxml=reports/junit.xml
      - name: Swift
        if: needs.paths.outputs.swift == 'true'
        run: swift-format lint --recursive . && (command -v swiftlint >/dev/null && swiftlint || true) && swift test
      - name: Rust
        if: needs.paths.outputs.rust == 'true'
        run: cargo fmt --check && cargo clippy --all-targets --all-features -- -D warnings && cargo test
      - name: Go
        if: needs.paths.outputs.go == 'true'
        run: test -z "$(gofmt -l .)" && go vet ./... && go test ./...
      - name: Shell
        if: needs.paths.outputs.shell == 'true'
        run: find . -type f \( -name '*.sh' -o -name '*.bash' -o -path './tools/*' \) -print0 | xargs -0 -r -n1 shellcheck
      - name: Test reporter
        if: always() && hashFiles('reports/**/*.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: test results
          path: reports/**/*.xml
          reporter: java-junit
          fail-on-error: true

  scope:
    name: scope guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false, fetch-depth: 0}
      - run: ./tools/scope-guard

  config:
    name: agent config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {persist-credentials: false}
      - run: ./tools/agent-config-check

  ci-gate:
    name: CI Gate
    if: always()
    needs: [anti-rot, actionlint, security, paths, checks, scope, config]
    runs-on: ubuntu-latest
    steps:
      - name: Accept success or legitimate skip only
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*) exit 1 ;;
            *,skipped,*)
              test ",${RESULTS}," = ",success,success,success,success,success,success,success," || exit 1
              ;;
            *) exit 0 ;;
          esac
