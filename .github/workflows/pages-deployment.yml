name: Deploy Cloudflare Pages

# Pubblica in produzione il sito del progetto su Cloudflare Pages.
#
# Cartella del sito e nome del progetto Pages non sono scritti qui: arrivano da
# config/template/pages.json, generato da copier dalle risposte `site_dir` e
# `cloudflare_project`. Dove quel file non c'è (per esempio nel repository
# template, che non pubblica alcun sito) il deploy viene saltato.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Pages configuration
        id: cfg
        run: |
          set -Eeuo pipefail
          config="config/template/pages.json"
          if [[ ! -f "$config" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Nessun $config: questo repository non pubblica un sito, deploy saltato."
            exit 0
          fi
          site_dir="$(jq -r '.siteDir // empty' "$config")"
          project="$(jq -r '.cloudflareProject // empty' "$config")"
          [[ -n "$site_dir" ]] || { echo "siteDir non definito in $config"; exit 1; }
          [[ -n "$project" ]] || { echo "cloudflareProject non definito in $config"; exit 1; }
          [[ -d "$site_dir" ]] || { echo "La cartella del sito '$site_dir' non esiste"; exit 1; }
          {
            echo "configured=true"
            echo "site_dir=$site_dir"
            echo "project=$project"
          } >> "$GITHUB_OUTPUT"

      - name: Check Cloudflare credentials
        if: steps.cfg.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "Missing repository secret: CLOUDFLARE_API_TOKEN. Add an account-scoped Cloudflare API token with Pages Edit permission."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID. Add the Cloudflare account ID for the Pages project."
            exit 1
          fi

      - name: Deploy site to Cloudflare Pages
        # One-time setup: create an account-scoped Cloudflare API token with Pages Edit permission,
        # then add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets.
        if: steps.cfg.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.113.0"
          workingDirectory: ${{ steps.cfg.outputs.site_dir }}
          command: pages deploy . --project-name=${{ steps.cfg.outputs.project }} --branch=main
          githubToken: ${{ github.token }}
